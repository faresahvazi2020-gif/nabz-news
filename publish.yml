name: Update news and publish site
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"       # hourly (UTC)
    - cron: "30 3 * * *"      # 07:00 Asia/Tehran
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch news feeds
        run: python scripts/update_news.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/daily_digest.json
          git diff --cached --quiet || git commit -m "Update news feed"
          git push
  deploy:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
